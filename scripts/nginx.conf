# =============================================================================
# Nginx Configuration — Telegram AI Companion
# Location on server: /etc/nginx/sites-available/telegram-bot
# Symlink: ln -s /etc/nginx/sites-available/telegram-bot /etc/nginx/sites-enabled/
#
# Replace YOUR_DOMAIN with your actual domain (e.g. api.mybotdomain.com)
# SSL certificates are managed by Certbot — run certbot after this is in place.
# =============================================================================

# Upstream — Node.js app running on port 3000
# In PM2 cluster mode all workers share the same port.
upstream nodejs_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP — redirect everything to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Certbot challenge path — must be HTTP accessible during cert issuance
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # All other traffic → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main server block
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── SSL (Certbot fills these in automatically) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Logging ─────────────────────────────────────────────────────────
    access_log /var/log/nginx/telegram-bot.access.log;
    error_log  /var/log/nginx/telegram-bot.error.log;

    # ── Client body size ────────────────────────────────────────────────
    # 1 MB matches our Express body parser limit
    client_max_body_size 1m;

    # ── Timeouts ────────────────────────────────────────────────────────
    # Telegram webhook must respond within 5 seconds — keep these tight
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ── Common proxy headers ────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    # ── Health check — public, no auth ─────────────────────────────────
    location /health {
        proxy_pass http://nodejs_app;
        access_log off;  # Don't clutter logs with health polls
    }

    # ── Telegram Webhook — Telegram servers only ────────────────────────
    # Extra IP restriction: Telegram sends from a known CIDR range.
    # We also validate the secret header inside the app, so this is
    # defence-in-depth only. Remove the allow/deny lines if you don't
    # want to maintain the Telegram IP list.
    location /webhook/ {
        # Allow Telegram IP ranges (as of 2024) + allow localhost for testing
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        allow 127.0.0.1;
        deny  all;

        proxy_pass http://nodejs_app;

        # Telegram requires responses within 5 seconds
        proxy_read_timeout 10s;
    }

    # ── Admin dashboard — restrict by IP in production ──────────────────
    # Uncomment and set YOUR_OFFICE_IP to lock the admin to your IP only.
    location /admin {
        # allow YOUR_OFFICE_IP;
        # deny  all;

        proxy_pass http://nodejs_app;

        # Longer timeout for admin queries (analytics, bulk operations)
        proxy_read_timeout 60s;
    }

    # ── All other routes ────────────────────────────────────────────────
    location / {
        proxy_pass http://nodejs_app;
    }

    # ── Block common attack paths ───────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
